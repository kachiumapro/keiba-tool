function ninki(pop){
  if(!pop||pop===0) return '<span style="color:#aaa">-</span>';
  const mark=pop<=3?'◎':pop<=5?'○':'△';
  const color=pop<=3?'#c0392b':pop<=5?'#2471a3':'#7f8c8d';
  const weight=pop<=3?'bold':'normal';
  return `<span style="color:${color};font-weight:${weight}">${mark}${pop}人気</span>`;
}

function rankBadge(rank){
  if(!rank||rank===0) return '';
  const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
  const color=rank<=3?'#27ae60':'#888';
  const weight=rank<=3?'bold':'normal';
  return `<span style="color:${color};font-weight:${weight}">${medal?medal+rank+'着':rank+'着'}</span>`;
}

// ha=早いレースの馬番, ta=早いレースの頭数
// hb=遅いレースの馬番, tb=遅いレースの頭数
function matchTypes(ha,ta,hb,tb){
  const r=[];
  // 正：表同士（同頭数OK）
  if(ha===hb) r.push('正');
  // 逆：表裏逆（両方向）・同頭数OK
  // 方向1: 表(早)=裏(遅)  方向2: 裏(早)=表(遅)
  const revA=ta+1-ha, revB=tb+1-hb;
  if(revB===ha || revA===hb) r.push('逆');
  // 循環：頭数の少ない方(ta<tb)のみ。循環正が成立すれば循環逆は調べない
  if(ta<tb){
    if(ha+ta===hb){
      r.push('循環正');
    } else {
      if(revA+ta===hb) r.push('循環逆');
    }
  }
  // 裏同士：裏(早)===裏(遅)、同頭数は対象外
  if(revA===revB && ta!==tb) r.push('裏裏');
  // 1位一致：1の位が同じ（表のみ・同頭数OK・裏循環なし）
  // 01↔11, 02↔12, ..., 08↔18のみ有効
  if(ha!==hb && ha%10===hb%10 && ha%10!==0) r.push('1位');
  return [...new Set(r)];
}

function findMatches(races){
  const FIELDS=[
    {f:'jockey',l:'騎手'},
    {f:'trainer',l:'調教師'},
    {f:'owner',l:'馬主'}
  ];
  const results=[];

  for(const r2 of races){
    for(const h2 of r2.horses){
      // 取消馬判定：同レースに人気データがある馬が1頭でもいる場合のみ取消扱い
      // （レース前は全馬popularity=0のため全馬スキップしないようにする）
      const r2HasData = r2.horses.some(h=>h.popularity>0);
      if(r2HasData && h2.popularity===0 && h2.rank===0 && h2.horse_name) continue;

      const connsByField={jockey:[],trainer:[],owner:[]};

      for(const fld of FIELDS){
        const fname=fld.f;
        const flabel=fld.l;
        const name=h2[fname];
        if(!name) continue;

        for(const r1 of races){
          // r2より早いレースのみ参照（r2が勝負候補、r1が参照）
          if(r1.race_id>=r2.race_id) continue;
          for(const h1 of r1.horses){
            if(h1[fname]!==name) continue;
            const types=matchTypes(
              h1.horse_no, r1.total_horses,
              h2.horse_no, r2.total_horses
            );
            if(types.length>0){
              connsByField[fname].push({
                field:fname, label:flabel, name:name,
                r1:r1, h1:h1, types:types
              });
            }
          }
        }
      }

      const allConns=[
        ...connsByField.jockey,
        ...connsByField.trainer,
        ...connsByField.owner
      ];
      if(allConns.length===0) continue;

      const matchedCount=['jockey','trainer','owner']
        .filter(k=>connsByField[k].length>0).length;

      results.push({
        r2:r2, h2:h2,
        connections:allConns,
        rank:matchedCount,
        hasSei:allConns.some(c=>c.types.includes('正')),
        hasJockey:connsByField.jockey.length>0,
        hasTrainer:connsByField.trainer.length>0,
        hasOwner:connsByField.owner.length>0
      });
    }
  }

  results.sort((a,b)=>
    b.rank-a.rank ||
    a.r2.race_no-b.r2.race_no ||
    a.h2.horse_no-b.h2.horse_no
  );
  return results;
}

const allMatches=findMatches(RACE_DATA.races);

function render(matches){
  const el=document.getElementById('main');
  if(!matches.length){
    el.innerHTML='<div class="no-match">該当するレースがありません</div>';
    return;
  }
  const takeshi='<span style="color:#e74c3c;font-weight:bold;font-size:11px">取消</span>';
  const mikanryo='<span style="color:#aaa">-</span>';
  let html='';
  [
    {rank:3,label:'🔥 最強勝負（3者が同一馬番に収束）'},
    {rank:2,label:'⭐ 有力（2者が同一馬番に収束）'},
    {rank:1,label:'👀 注目（1者一致）'}
  ].forEach(s=>{
    const sub=matches.filter(m=>m.rank===s.rank);
    if(!sub.length) return;
    html+=`<div class="section-title">${s.label} ${sub.length}件</div>`;
    html+=sub.map(m=>{
      const {r2,h2,connections}=m;
      const rl=m.rank===3?'🔥 最強勝負':m.rank===2?'⭐ 有力':'👀 注目';
      // レース前（全馬popularity=0）は未完了、一部のみ0は取消
      const r2HasData=r2.horses.some(h=>h.popularity>0);
      const h2canceled=r2HasData&&(h2.popularity===0&&h2.rank===0);
      const h2pop=h2canceled?takeshi:ninki(h2.popularity);

      const allT=[...new Set(connections.flatMap(c=>c.types))];
      const tBadge=allT.map(t=>`<span class="tb t${t}">${t}</span>`).join('');

      const seen=new Set();
      const pBadge=connections.filter(c=>{
        const k=c.field+'::'+c.name;
        if(seen.has(k)) return false;
        seen.add(k); return true;
      }).map(c=>{
        const pc=c.field==='jockey'?'pj':c.field==='trainer'?'pt':'po';
        return `<span class="pb ${pc}">${c.label}:${c.name}</span>`;
      }).join('');

      let rows='';
      connections.forEach(c=>{
        const pc=c.field==='jockey'?'pj':c.field==='trainer'?'pt':'po';
        const tb2=c.types.map(t=>`<span class="tb t${t}">${t}</span>`).join('');
        // r1（参照レース）も同様に未完了判定
        const r1HasData=c.r1.horses.some(h=>h.popularity>0);
        const h1canceled=r1HasData&&(c.h1.popularity===0&&c.h1.rank===0&&c.h1.horse_name);
        const h1pop=h1canceled?takeshi:ninki(c.h1.popularity);
        const h1rank=h1canceled?takeshi:rankBadge(c.h1.rank);
        const pops=[c.h1.popularity,h2.popularity].filter(p=>p>0);
        const bestPop=pops.length?Math.min(...pops):99;
        const rowCls=bestPop<=3?'row-maru-ni':bestPop<=5?'row-maru-ichi':'row-sankaku';
        rows+=`<tr class="${rowCls}">
          <td><span class="pb ${pc}">${c.label}</span></td>
          <td style="font-weight:bold">${c.name}</td>
          <td>${c.r1.venue} ${c.r1.race_no}R</td>
          <td style="text-align:center;font-weight:bold">${c.r1.total_horses}頭</td>
          <td>${c.h1.gate||'?'}枠 ${c.h1.horse_no||'?'}番</td>
          <td>${c.h1.horse_name||''}</td>
          <td>${h1pop}</td>
          <td>${h1rank}</td>
          <td style="background:#fff0f0;font-weight:bold">${r2.venue} ${r2.race_no}R</td>
          <td style="background:#fff0f0;text-align:center;font-weight:bold;color:#c0392b">${r2.total_horses}頭</td>
          <td style="background:#fff0f0">${h2.gate||'?'}枠 ${h2.horse_no||'?'}番</td>
          <td style="background:#fff0f0">${h2.horse_name||''}</td>
          <td style="background:#fff0f0">${h2canceled?takeshi:ninki(h2.popularity)}</td>
          <td style="background:#fff0f0">${h2canceled?takeshi:rankBadge(h2.rank)}</td>
          <td>${tb2}</td>
        </tr>`;
      });

      return `<div class="match-card rank-${m.rank}">
        <div class="card-header" onclick="tog(this)">
          <span class="rank-badge">${rl}</span>
          <span class="card-races">🎯勝負候補：${r2.venue} ${r2.race_no}R ${h2.gate}枠<strong>${h2.horse_no}番 ${h2.horse_name}</strong></span>
          <span class="card-right">${h2pop}${pBadge}${tBadge}<span>▼</span></span>
        </div>
        <div class="card-body">
          <table class="match-table">
            <thead><tr>
              <th>種別</th><th>氏名</th>
              <th>参照レース</th><th>頭数</th><th>枠/番</th><th>参照馬名</th><th>人気</th><th>着順</th>
              <th style="background:#c0392b;color:white">🎯勝負候補</th>
              <th style="background:#c0392b;color:white">頭数</th>
              <th style="background:#c0392b;color:white">枠/番</th>
              <th style="background:#c0392b;color:white">馬名</th>
              <th style="background:#c0392b;color:white">人気</th>
              <th style="background:#c0392b;color:white">着順</th>
              <th>一致種別</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
    }).join('');
  });
  el.innerHTML=html;
}

function tog(h){
  const b=h.nextElementSibling;
  b.classList.toggle('open');
  h.querySelector('.card-right span:last-child').textContent=
    b.classList.contains('open')?'▲':'▼';
}

function setFilter(val,btn){
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  let f;
  if(val==='all') f=allMatches;
  else if(val==='jockey') f=allMatches.filter(m=>m.hasJockey&&!m.hasTrainer&&!m.hasOwner);
  else if(val==='trainer') f=allMatches.filter(m=>m.hasTrainer&&!m.hasJockey&&!m.hasOwner);
  else if(val==='owner') f=allMatches.filter(m=>m.hasOwner&&!m.hasJockey&&!m.hasTrainer);
  else f=allMatches.filter(m=>m.rank===val);
  render(f);
  updateSummary(f.length);
}

function updateSummary(shown){
  const s3=allMatches.filter(m=>m.rank===3).length;
  const s2=allMatches.filter(m=>m.rank===2).length;
  const s1=allMatches.filter(m=>m.rank===1).length;
  document.getElementById('summary-text').textContent=
    `表示 ${shown}件 ｜ 🔥${s3} ⭐${s2} 👀${s1}`;
}

render(allMatches);
updateSummary(allMatches.length);
const gekiAtsuResults=detectGekiAtsu();
renderGekiAtsu(gekiAtsuResults);
buildNameButtons();

function detectGekiAtsu(){
  const personMap=new Map();
  allMatches.forEach(m=>{
    m.connections.forEach(c=>{
      const key=c.field+'::'+c.name;
      if(!personMap.has(key)) personMap.set(key,{field:c.field,name:c.name,items:[]});
      personMap.get(key).items.push({
        h2_no:m.h2.horse_no, h2_total:m.r2.total_horses,
        types:[...c.types], venue:m.r2.venue,
        race_no:m.r2.race_no, horse_name:m.h2.horse_name
      });
    });
  });

  const detected=[];
  personMap.forEach(({field,name,items})=>{
    // レース単位で重複排除
    const seen=new Set();
    const uniq=items.filter(i=>{
      const k=i.venue+i.race_no;
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
    if(uniq.length<3) return;

    const nos=uniq.map(i=>i.h2_no);
    const totals=uniq.map(i=>i.h2_total);

    // パターン1: 全同一馬番（準激アツ）
    if(nos.every(n=>n===nos[0])){
      detected.push({field,name,level:'準激アツ',pattern:`全${nos[0]}番一致`,items:uniq});
      return;
    }
    // パターン2: 全1の位一致（激アツ）
    const ones=nos[0]%10;
    if(ones!==0 && nos.every(n=>n%10===ones)){
      detected.push({field,name,level:'激アツ',pattern:`全1の位${ones}番一致`,items:uniq});
      return;
    }
    // パターン3: 全最内/大外（激アツ）
    if(nos.every((n,i)=>n===1||n===totals[i])){
      detected.push({field,name,level:'激アツ',pattern:'全最内/大外一致',items:uniq});
      return;
    }
    // パターン4: 全循環（激アツ）
    if(uniq.every(i=>i.types.some(t=>t.startsWith('循環')))){
      detected.push({field,name,level:'激アツ',pattern:'全循環一致',items:uniq});
      return;
    }
  });
  return detected;
}

function renderGekiAtsu(list){
  const el=document.getElementById('gekiatsu-section');
  if(!list.length){el.innerHTML='';return;}
  const fieldLabel=f=>f==='jockey'?'🏇騎手':'👔調教師';
  let html='<div class="section-title">💮 激アツパターン検出 '+list.length+'件</div>';
  list.forEach(g=>{
    const badge=g.level==='激アツ'?'💮激アツ':'💮準激アツ';
    html+=`<div class="ga-card ${g.level==='激アツ'?'ga-hot':'ga-warm'}">
      <div class="ga-header">
        <span class="ga-badge">${badge}</span>
        <span class="ga-name">${fieldLabel(g.field)} ${g.name}</span>
        <span class="ga-pattern">${g.pattern}</span>
      </div>
      <div class="ga-body">
        ${g.items.map(i=>`<span class="ga-item">${i.venue}${i.race_no}R <strong>${i.h2_no}番</strong>${i.horse_name}</span>`).join('<span class="ga-arrow">→</span>')}
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

function buildNameButtons(){
  // 名前ごとに {count, maxRank} を集計
  const jockeys=new Map(), trainers=new Map(), owners=new Map();
  allMatches.forEach(m=>{
    m.connections.forEach(c=>{
      const map=c.field==='jockey'?jockeys:c.field==='trainer'?trainers:c.field==='owner'?owners:null;
      if(!map) return;
      const cur=map.get(c.name)||{cnt:0,maxRank:0};
      cur.cnt++;
      if(m.rank>cur.maxRank) cur.maxRank=m.rank;
      map.set(c.name,cur);
    });
  });

  // ボタンのスタイルを最高ランクで決定
  function btnStyle(maxRank){
    if(maxRank>=3) return 'nb nb-rank3';  // 🔥赤
    if(maxRank>=2) return 'nb nb-rank2';  // ⭐オレンジ
    return 'nb';
  }

  // 激アツ優先→最高ランク降順→件数降順でソート
  const gaLevelMap=new Map(gekiAtsuResults.map(g=>[g.field+'::'+g.name, g.level==='激アツ'?2:1]));
  const sortFn=(a,b)=>{
    const [fA,nA]=a[0].split('::'), [fB,nB]=b[0].split('::');
    const gaA=gaLevelMap.get(fA+'::'+nA)||0;
    const gaB=gaLevelMap.get(fB+'::'+nB)||0;
    return gaB-gaA||b[1].maxRank-a[1].maxRank||b[1].cnt-a[1].cnt;
  };

  // 激アツマップ作成
  const gaMap=new Map();
  gekiAtsuResults.forEach(g=>gaMap.set(g.field+'::'+g.name,g.level));

  function namePrefix(field,name,maxRank){
    const ga=gaMap.get(field+'::'+name);
    if(ga) return ga==='激アツ'?'💮':'💮';
    return maxRank>=3?'🔥':maxRank>=2?'⭐':'';
  }

  document.getElementById('jockey-buttons').innerHTML=
    [...jockeys.entries()].sort(sortFn).map(([name,{cnt,maxRank}])=>{
      const ga=gaMap.get('jockey::'+name);
      const cls=ga?'nb nb-ga'+(ga==='激アツ'?'-hot':'-warm'):btnStyle(maxRank);
      return `<button class="${cls}" onclick="filterByName('jockey','${name}',this)">${namePrefix('jockey',name,maxRank)}${name}(${cnt})</button>`;
    }).join('');
  document.getElementById('trainer-buttons').innerHTML=
    [...trainers.entries()].sort(sortFn).map(([name,{cnt,maxRank}])=>{
      const ga=gaMap.get('trainer::'+name);
      const cls=ga?'nb nb-ga'+(ga==='激アツ'?'-hot':'-warm'):btnStyle(maxRank);
      return `<button class="${cls}" onclick="filterByName('trainer','${name}',this)">${namePrefix('trainer',name,maxRank)}${name}(${cnt})</button>`;
    }).join('');
  document.getElementById('owner-buttons').innerHTML=
    [...owners.entries()].sort(sortFn).map(([name,{cnt,maxRank}])=>{
      const ga=gaMap.get('owner::'+name);
      const cls=ga?'nb nb-ga'+(ga==='激アツ'?'-hot':'-warm'):btnStyle(maxRank);
      return `<button class="${cls}" onclick="filterByName('owner','${name}',this)">${namePrefix('owner',name,maxRank)}${name}(${cnt})</button>`;
    }).join('');

  // レース別ボタン
  const races=new Map();
  allMatches.forEach(m=>{
    const key=m.r2.race_id;
    const cur=races.get(key)||{label:`${m.r2.venue} ${m.r2.race_no}R`,cnt:0,maxRank:0,race_id:key,race_no:m.r2.race_no,venue:m.r2.venue};
    cur.cnt++;
    if(m.rank>cur.maxRank) cur.maxRank=m.rank;
    races.set(key,cur);
  });
  // レースID順（開催順）でソート
  const raceSortFn=(a,b)=>a[0].localeCompare(b[0]);
  document.getElementById('race-buttons').innerHTML=
    [...races.entries()].sort(raceSortFn).map(([key,{label,cnt,maxRank}])=>
      `<button class="${btnStyle(maxRank)}" onclick="filterByRace('${key}',this)">${maxRank>=3?'🔥':maxRank>=2?'⭐':''}${label}(${cnt})</button>`
    ).join('');
}

function filterByName(field,name,btn){
  document.querySelectorAll('.nb,.fb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const f=allMatches.filter(m=>m.connections.some(c=>c.field===field&&c.name===name));
  render(f);
  updateSummary(f.length);
}

function filterByRace(race_id,btn){
  document.querySelectorAll('.nb,.fb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const f=allMatches.filter(m=>m.r2.race_id===race_id);
  render(f);
  updateSummary(f.length);
}
